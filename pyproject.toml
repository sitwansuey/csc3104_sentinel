# Project metadata and tool settings. Installs use the hash-locked files:
#   python -m pip install --require-hashes -r requirements.lock -r agent/datasets/requirements.lock
# The packages are not installed with pip yet; tests and scripts still add the
# repository root to sys.path.

[project]
name = "sentinel"
version = "1.0.0rc2"  # PEP 440 form of the VERSION file; scripts/release/preflight.py checks they agree.
description = "Guarded, verified recovery for Kubernetes workloads (research prototype)"
requires-python = ">=3.12"
# The Coordinator, Guard, Executor and Verifier core uses the standard library only.
dependencies = []

[project.optional-dependencies]
# Ranges mirror the .in files; the .lock files hold the exact, hashed pins.
agent = ["pandas>=2.2,<4"]
eval = [
    "pandas>=2.2,<4",
    "pyarrow>=18",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3",
    "tqdm>=4.66",
    "requests>=2.32,<3",
]
dev = ["coverage[toml]>=7.6", "mypy>=1.13", "pip-audit>=2.7", "pip-tools>=7.4", "ruff>=0.8"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["dashboard", "outputs", "evidence", "data"]

[tool.ruff.lint]
# E9/F/PLE: syntax and real errors. B: likely bugs. UP: newer syntax.
# BLE001/S110/E722: no broad or silent exception handler without a reason
# (see scripts/ci/except_audit.py). S307: no eval().
select = ["E9", "F", "W6", "B", "BLE001", "S110", "S307", "E722", "PLE", "UP"]

[tool.ruff.lint.per-file-ignores]
# BASELINE-START
# Generated by 'python scripts/ci/ruff_baseline.py --write' from the code as it was
# when the gate was added. Each entry lists rules this file already broke, so
# CI is green without a mass rewrite, and new files get every rule. Fix a file,
# then remove its entry. BLE001 and S110 are never baselined outside tests/.
