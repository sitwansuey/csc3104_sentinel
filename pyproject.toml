[tool.coverage.run]
branch = true
source = ["services", "runtime", "shared", "agent"]
omit = ["experiments/*", "scripts/*", "tests/*"]

[tool.coverage.report]
skip_empty = true

[tool.mypy]
python_version = "3.12"
# A small strict subset; widen it module by module.
files = [
    "shared/canonical.py",
    "shared/log.py",
    "shared/provenance.py",
    "shared/tracing.py",
    "services/executor/reconciliation.py",
]
strict = true
follow_imports = "silent"
