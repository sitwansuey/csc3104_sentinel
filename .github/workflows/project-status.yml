name: Project status

on:
  # The existing Checks workflow runs on pushes, including older feature branches.
  # This handler executes from the default branch, never the pushed feature code.
  workflow_run:
    workflows: [Checks]
    types: [requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: sentinel-project-first-work
  cancel-in-progress: false
  queue: max

jobs:
  update:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Update project from trusted event metadata
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/project_status.py
