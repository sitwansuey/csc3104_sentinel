name: Project status

on:
  # The existing Checks workflow runs on pushes, including older feature branches.
  # This handler executes from the default branch, never the pushed feature code.
  workflow_run:
    workflows: [Checks]
    types: [requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: sentinel-project-first-work
  cancel-in-progress: false
  queue: max

jobs:
  update:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Update project from trusted event metadata
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/project_status.py
