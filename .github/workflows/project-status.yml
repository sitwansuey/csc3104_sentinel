name: Project status

on:
  # The existing Checks workflow runs on pushes, including older feature branches.
  # This handler executes from the default branch, never the pushed feature code.
  workflow_run:
    workflows: [Checks]
    types: [requested]
  pull_request_target:
    types: [opened, reopened, labeled, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: sentinel-project-status-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'pull_request_target' &&
       contains(github.event.pull_request.labels.*.name, 'ready to merge'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update project from trusted event metadata
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python .github/scripts/project_status.py
