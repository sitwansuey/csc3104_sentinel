# Weekly, grouped update proposals so pinned SHAs, digests and locks do not rot.
# A pip update to a .in file must be followed by 'python scripts/ci/locks.py
# --compile' on the same branch: the quality job fails until the hashed locks
# match their inputs again.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /deploy/docker
      - /experiments/workloads/demo
      - /experiments/workloads/otel
      - /experiments/workloads/verifier-lab
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /
      - /agent/datasets
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard:
        patterns: ["*"]
