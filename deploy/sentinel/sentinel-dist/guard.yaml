# guard-1 of the sentinel-dist lab. It reads the target Deployment with its
# own read-only ServiceAccount (rbac.yaml: get on demo-api only) through the
# in-Pod kubeconfig (kubeconfig.yaml), which names the projected token file
# and holds no credential. Its own Secret holds its delivery and approval
# credentials; its own PVC holds transport.db.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-dist-guard-1-data
  namespace: sentinel-dist
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-dist-guard-1-config
  namespace: sentinel-dist
data:
  worker.json: |
    {
      "role": "guard",
      "identity": "guard-1",
      "url": "https://sentinel-coordinator.sentinel-dist.svc:8766",
      "token_env": "SENTINEL_DELIVERY_TOKEN",
      "ca": "/coordinator-ca/ca.crt",
      "state_directory": "/data/guard-1",
      "cluster_id": "sentinel-dist",
      "context": "kind-sentinel-dist",
      "kubeconfig": "/kube/kubeconfig",
      "policy": "/inputs/policy.json",
      "baseline": "/inputs/baseline.json",
      "server_dry_run": false,
      "approvals": {
        "url": "https://sentinel-coordinator.sentinel-dist.svc:8767",
        "identity": "guard-1",
        "token_env": "SENTINEL_APPROVAL_TOKEN",
        "ca": "/coordinator-ca/ca.crt"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-guard-1
  namespace: sentinel-dist
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sentinel-guard-1
  template:
    metadata:
      labels:
        app: sentinel-guard-1
        sentinel.io/component: guard
        sentinel.io/identity: guard-1
        sentinel.io/api-access: "true"
    spec:
      serviceAccountName: sentinel-guard
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      nodeSelector:
        sentinel.io/host: c
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: sentinel-worker:local
          imagePullPolicy: Never
          args: ["--role", "guard", "--config", "/config/worker.json", "--health-port", "8080"]
          env:
            - name: SENTINEL_FAULT_POINTS
              value: /faults
            - name: SENTINEL_FAULT_CLUSTER
              value: sentinel-dist
            - name: SENTINEL_FAULT_PROCESS
              value: guard-1
            - name: SENTINEL_DELIVERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sentinel-dist-guard-1
                  key: delivery-token
            - name: SENTINEL_APPROVAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sentinel-dist-guard-1
                  key: approval-token
          readinessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - "-c"
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: inputs
              mountPath: /inputs
              readOnly: true
            - name: coordinator-ca
              mountPath: /coordinator-ca
              readOnly: true
            - name: kubeconfig
              mountPath: /kube
              readOnly: true
            - name: faults
              mountPath: /faults
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sentinel-dist-guard-1-data
        - name: config
          configMap:
            name: sentinel-dist-guard-1-config
        - name: inputs
          configMap:
            name: sentinel-dist-inputs
        - name: coordinator-ca
          configMap:
            name: sentinel-dist-coordinator-ca
        - name: kubeconfig
          configMap:
            name: sentinel-dist-kubeconfig
        - name: faults
          emptyDir: {}
        - name: tmp
          emptyDir: {}
