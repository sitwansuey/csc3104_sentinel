# The kubeconfig the Guard and the Executors give kubectl inside their Pods.
# It holds no credential: the user entry names the Pod's own projected
# ServiceAccount token file, which the kubelet rotates, and the cluster entry
# names the in-cluster CA file. The context is named kind-sentinel-dist so a
# worker bound to the lab gate for cluster sentinel-dist accepts it
# (runtime/fault_points.py LAB_CONTEXTS).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-dist-kubeconfig
  namespace: sentinel-dist
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: sentinel-dist
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: in-pod-service-account
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: kind-sentinel-dist
        context:
          cluster: sentinel-dist
          user: in-pod-service-account
    current-context: kind-sentinel-dist
