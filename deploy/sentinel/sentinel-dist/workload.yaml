# The light target workload of the sentinel-dist lab: the demo API from
# deploy/workloads/demo.yaml, moved to sentinel-dist-workload and pinned to
# node c, so pausing node a or b never stops the target. The image is built
# locally (sentinel-demo:0.1.0) and loaded with kind load; the harness records
# its image ID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: sentinel-dist-workload
  labels:
    app: demo-api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 2
  progressDeadlineSeconds: 90
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        sentinel.io/host: c
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api
          image: sentinel-demo:0.1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STARTUP_FAILURE
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: sentinel-dist-workload
spec:
  type: ClusterIP
  selector:
    app: demo-api
  ports:
    - name: http
      port: 8080
      targetPort: http
