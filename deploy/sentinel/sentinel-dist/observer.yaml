# observer-1 of the sentinel-dist lab: the Observer image watching demo-api
# with its own read-only ServiceAccount (rbac.yaml) and delivering incidents
# to the Coordinator over HTTPS. It never mounts the Coordinator's PVC. Its own
# Secret holds its delivery credential; its own PVC holds observer.sqlite3.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-dist-observer-1-data
  namespace: sentinel-dist
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-observer-1
  namespace: sentinel-dist
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sentinel-observer-1
  template:
    metadata:
      labels:
        app: sentinel-observer-1
        sentinel.io/component: observer
        sentinel.io/identity: observer-1
        sentinel.io/api-access: "true"
    spec:
      serviceAccountName: sentinel-observer
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      nodeSelector:
        sentinel.io/host: c
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          image: sentinel-observer:0.2.0
          imagePullPolicy: Never
          args:
            - run
            - "--in-cluster"
            - "--namespace=sentinel-dist-workload"
            - "--deployment=demo-api"
            - "--cluster-id=sentinel-dist"
            - "--state=/data/observer.sqlite3"
            - "--coordinator-url=https://sentinel-coordinator.sentinel-dist.svc:8766"
            - "--coordinator-identity=observer-1"
            - "--coordinator-token-env=SENTINEL_DELIVERY_TOKEN"
            - "--coordinator-ca=/coordinator-ca/ca.crt"
            - "--policy=/inputs/observer-policy.json"
            - "--interval-seconds=2"
            - "--collect-logs"
          env:
            - name: SENTINEL_DELIVERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sentinel-dist-observer-1
                  key: delivery-token
          readinessProbe:
            exec:
              command: [python, "-m", services.observer.cli, health, "--state=/data/observer.sqlite3"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: inputs
              mountPath: /inputs
              readOnly: true
            - name: coordinator-ca
              mountPath: /coordinator-ca
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sentinel-dist-observer-1-data
        - name: inputs
          configMap:
            name: sentinel-dist-inputs
        - name: coordinator-ca
          configMap:
            name: sentinel-dist-coordinator-ca
