# Lab execution identity. Apply with an administrator, then run the executor
# using a kubeconfig containing only this service account's credentials.
# Kubernetes RBAC limits resources/verbs, not individual Deployment fields;
# the restricted executor adapter supplies the exact conditional JSON Patch.
# executor-admission.yaml adds field limits for this ServiceAccount (P3.05) in
# the namespaces its binding selects: Pod template changes only with new
# evidence, only the sentinel.io execution and fence annotations, and never a
# lower fence epoch. Evaluated live once (C-ADMISSION-POLICY-LIVE); not installed in the labs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-executor
  namespace: sentinel-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-executor
  namespace: sentinel-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["demo-api"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-executor
  namespace: sentinel-demo
subjects:
  - kind: ServiceAccount
    name: sentinel-executor
    namespace: sentinel-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinel-executor
