# Four-node lab cluster sentinel-dist for the P4.01 distributed acceptance run.
# One control plane and three workers, each worker labelled sentinel.io/host=a|b|c
# so deploy/sentinel/sentinel-dist pins the Coordinator (c), executor-a (a) and
# executor-b (b) to three different nodes. These are four containers on one
# Docker host: each node has its own network namespace and kubelet, but they
# share one kernel, one clock and one disk. They are not separate machines.
# The node image is the one kind v0.33.0 lists for Kubernetes v1.37.0, pinned
# by digest. Create it from the repository root, because extraMounts
# resolves hostPath against the working directory:
#   kind create cluster --name sentinel-dist --config deploy/kind/kind-dist.yaml
# The API server audit log (policy: deploy/kind/audit-policy.yaml) is written to
# /var/log/kubernetes/kube-apiserver-audit.log on sentinel-dist-control-plane.
# The auditing patch follows kind's own guide for v0.33.0 (docs/user/auditing).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sentinel-dist
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
            audit-log-maxsize: "100"
            audit-log-maxbackup: "3"
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: deploy/kind/audit-policy.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      sentinel.io/host: a
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      sentinel.io/host: b
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      sentinel.io/host: c
